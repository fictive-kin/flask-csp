[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-csp"
version = "1.1.1"
description = "A Flask extension/decorator to easily add Content-Security-Policy (CSP) headers"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Fictive Kin LLC", email = "hello@fictivekin.com" }]
maintainers = [{ name = "Fictive Kin LLC", email = "hello@fictivekin.com" }]
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
full = [
    "SQLAlchemy>=2.0",
]
tests = [
    "flask-csp[full]",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-randomly>=5.0",
]
lint = [
    "pylint>=4.1",
]
docs = [
    "sphinx>=8.1",
    "sphinx-rtd-theme>=3.0",
]

[project.urls]
Homepage = "https://github.com/fictive-kin/flask-csp"

[tool.setuptools.packages.find]
include = ["flask_csp*"]

[tool.setuptools.package-data]
flask_csp = ["templates/**/*.html"]
